version = 1
revision = 3
requires-python = ">=3.13"
resolution-markers = [
    "python_full_version >= '3.14' and sys_platform == 'win32'",
    "python_full_version >= '3.14' and sys_platform == 'emscripten'",
    "python_full_version >= '3.14' and sys_platform != 'emscripten' and sys_platform != 'win32'",
    "python_full_version < '3.14' and sys_platform == 'win32'",
    "python_full_version < '3.14' and sys_platform == 'emscripten'",
    "python_full_version < '3.14' and sys_platform != 'emscripten' and sys_platform != 'win32'",
]

[manifest]
constraints = [
    { name = "anyio", specifier = ">=4.13.0,<5.0.0" },
    { name = "certifi", specifier = ">=2026.4.22" },
    { name = "charset-normalizer", specifier = ">=3.4.7,<4.0.0" },
    { name = "click", specifier = ">=8.3.3,<9.0.0" },
    { name = "h11", specifier = ">=0.16.0,<1.0.0" },
    { name = "idna", specifier = ">=3.14,<4.0.0" },
    { name = "iniconfig", specifier = ">=2.3.0,<3.0.0" },
    { name = "narwhals", specifier = ">=2.21.0,<3.0.0" },
    { name = "numpy", specifier = ">=2.4.4,<3.0.0" },
    { name = "packaging", specifier = ">=26.2,<27.0.0" },
    { name = "pandas", specifier = ">=3.0.3,<4.0.0" },
    { name = "pillow", specifier = ">=12.2.0,<13.0.0" },
    { name = "pluggy", specifier = ">=1.6.0,<2.0.0" },
    { name = "pygments", specifier = ">=2.20.0,<3.0.0" },
    { name = "pytest", specifier = ">=9.0.3,<10.0" },
    { name = "python-dateutil", specifier = ">=2.9.0.post0,<3.0.0" },
    { name = "python-multipart", specifier = ">=0.0.28,<0.1.0" },
    { name = "requests", specifier = ">=2.34.0,<3.0.0" },
    { name = "six", specifier = ">=1.17.0,<2.0.0" },
    { name = "starlette", specifier = ">=1.0.0,<2.0.0" },
    { name = "typing-extensions", specifier = ">=4.15.0,<5.0.0" },
    { name = "urllib3", specifier = ">=2.7.0,<3.0.0" },
    { name = "uvicorn", specifier = ">=0.46.0,<1.0.0" },
    { name = "websockets", specifier = ">=15.0.1,<16.0.0" },
]

[[package]]
name = "keelim-maestro"
version = "0.1.0"
source = { virtual = "." }
