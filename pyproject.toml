[project]
name = "keelim-maestro"
version = "0.1.0"
description = "Workspace coordination layer for local Python projects"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false
constraint-dependencies = [
  "anyio>=4.13.0,<5.0.0",
  "certifi>=2026.4.22",
  "charset-normalizer>=3.4.7,<4.0.0",
  "click>=8.3.3,<9.0.0",
  "h11>=0.16.0,<1.0.0",
  "idna>=3.14,<4.0.0",
  "iniconfig>=2.3.0,<3.0.0",
  "narwhals>=2.21.0,<3.0.0",
  "numpy>=2.4.4,<3.0.0",
  "packaging>=26.2,<27.0.0",
  "pandas>=3.0.3,<4.0.0",
  "pillow>=12.2.0,<13.0.0",
  "pluggy>=1.6.0,<2.0.0",
  "pygments>=2.20.0,<3.0.0",
  "pytest>=9.0.3,<10.0",
  "python-dateutil>=2.9.0.post0,<3.0.0",
  "python-multipart>=0.0.28,<0.1.0",
  "requests>=2.34.0,<3.0.0",
  "six>=1.17.0,<2.0.0",
  "starlette>=1.0.0,<2.0.0",
  "typing-extensions>=4.15.0,<5.0.0",
  "urllib3>=2.7.0,<3.0.0",
  "uvicorn>=0.46.0,<1.0.0",
  "websockets>=15.0.1,<16.0.0",
]

[tool.uv.workspace]
members = [
  "toto",
  "rich",
]
